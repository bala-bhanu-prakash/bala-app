/* Brightlook Homes - mobile-first layer. Loaded AFTER the inline <style>; only adds/overrides. */
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--tab-h:62px}
html{scroll-behavior:smooth}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
.shell{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 28px)}
/* sticky, translucent top bar */
.topbar{position:sticky;top:0;z-index:30;padding-top:calc(12px + var(--safe-t));background:rgba(245,242,236,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);margin:0 -16px;padding-left:16px;padding-right:16px}
/* comfortable touch targets; 16px inputs stop iOS zooming on focus */
.btn{min-height:46px}.btn.sm{min-height:38px}
.field input,.field textarea,.field select{font-size:16px!important;min-height:48px}
button,.seg button{touch-action:manipulation}
/* bottom tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tabbar button .ic{font-size:21px;line-height:1}
.tabbar button.on{color:var(--brand)}
.tabbar button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.tabbar .dot{position:absolute;top:9px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(min-width:900px){.tabbar{position:static;max-width:420px;margin:16px 0 0;border:1px solid var(--line);border-radius:14px}}
/* customer hero */
.cust-hero{position:relative;margin:0 -16px;height:min(62vh,460px);min-height:300px;background:#2a2620 center/cover;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.cust-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%)}
.cust-hero .in{position:relative;z-index:1;padding:22px 20px 24px;width:100%;display:flex;align-items:flex-end;gap:16px}
.cust-hero .hi{font-size:13px;font-weight:600;opacity:.85}
.cust-hero h1{font-size:clamp(24px,6.4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.cust-hero .sub{font-size:13px;opacity:.85}
.ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;margin-left:auto;display:grid;place-items:center;background:conic-gradient(#f4b26a calc(var(--p)*1%),rgba(255,255,255,.25) 0);position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:rgba(20,17,13,.78);backdrop-filter:blur(6px)}
.ring b{position:relative;font-size:18px;font-weight:800}
.ring small{position:relative;display:block;font-size:9.5px;opacity:.8;margin-top:-2px;text-align:center}
.hero-fade{animation:heroIn .6s ease both}@keyframes heroIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
/* timeline */
.tl{position:relative;margin-top:22px;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:0;width:2px;background:linear-gradient(var(--brand-soft),var(--line))}
.tl-item{position:relative;margin-bottom:18px;animation:rise .45s ease both}
.tl-item::before{content:"";position:absolute;left:-24px;top:16px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 0 0 4px var(--bg)}
.tl-item.material::before{border-color:var(--blue)}
.tl-date{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.02em}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* swipeable photo carousel */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;border-radius:12px;background:#e9e3d8;cursor:zoom-in}
.car.multi img{flex-basis:92%}
.car-count{position:absolute;right:10px;top:10px;background:rgba(20,17,13,.7);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.car-wrap{position:relative}
/* image fade-in while loading */
img[data-lazy]{opacity:0;transition:opacity .35s ease}img[data-lazy].ld{opacity:1}
/* payments */
.pay-summary{padding:18px;display:grid;gap:14px}
.pay-big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.pay-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay-cols div{background:var(--bg);border-radius:12px;padding:10px 12px}
.pay-cols small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.pay-cols b{font-size:15px;font-weight:800}
.pay-cols .rec b{color:var(--green)}.pay-cols .bal b{color:var(--amber)}
.pay-bar{height:10px;background:#efe9de;border-radius:99px;overflow:hidden}
.pay-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#3fae7c);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pay-row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.pay-row:first-child{border-top:none}
.pay-ic{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pay-row .t{font-weight:700;font-size:14px}.pay-row .s{color:var(--muted);font-size:12.5px}
.pay-row .a{margin-left:auto;font-weight:800;color:var(--green);white-space:nowrap}
.pay-actions{display:flex;gap:6px;margin-left:8px}
/* instant-post feedback + skeletons */
.posting{opacity:.65;position:relative}
.posting::after{content:"Posting…";position:absolute;right:14px;top:12px;font-size:11.5px;font-weight:700;color:var(--brand)}
.failed{border-color:var(--red)!important}
.skel{background:linear-gradient(90deg,#ece6da 25%,#f6f2ea 37%,#ece6da 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:12px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.upload-bar{height:4px;background:var(--brand-soft);border-radius:99px;overflow:hidden;margin-top:8px}
.upload-bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
/* lightbox: swipe + pinch friendly */
.lb{touch-action:pan-y pinch-zoom}
/* phone tweaks */
@media(max-width:560px){
  .shell{padding-left:14px;padding-right:14px}
  .admin-stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat .num{font-size:21px}
  .decision-bar{flex-direction:column}
  .toast{bottom:calc(var(--tab-h) + var(--safe-b) + 14px)}
  .wa-overlay{padding:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
